<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Proton Mail</title>
<style>
  :root {
    --bar-h: 36px;
    --bg: #0e0d12;          /* carbon */
    --fg: #c9c6d3;
    --fg-dim: #8b8899;
    --hover: rgba(255, 255, 255, .08);
    --active: rgba(255, 255, 255, .13);
    --danger: #dc3251;
    --danger-active: #b8213e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { font: 12.5px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); }

  .bar {
    height: var(--bar-h);
    display: flex; align-items: stretch; justify-content: space-between;
    background: var(--bg);
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    -webkit-app-region: drag;
  }
  .brand { display: flex; align-items: center; gap: 9px; padding-left: 12px; }
  .brand img { width: 16px; height: 16px; display: block; }
  .brand span { color: var(--fg-dim); font-weight: 500; letter-spacing: .2px; }

  .controls { display: flex; -webkit-app-region: no-drag; }
  .controls button {
    width: 46px; height: 100%;
    display: grid; place-items: center;
    background: transparent; border: 0; color: var(--fg); cursor: default;
    transition: background-color .12s ease, color .12s ease;
    outline: none;
  }
  .controls button:hover { background: var(--hover); }
  .controls button:active { background: var(--active); }
  .controls button:focus-visible { box-shadow: inset 0 0 0 1px #6d4aff; }
  .controls button.close:hover { background: var(--danger); color: #fff; }
  .controls button.close:active { background: var(--danger-active); color: #fff; }
  svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }

  #fs .exit { display: none; }
  body.is-fs #fs .enter { display: none; }
  body.is-fs #fs .exit { display: block; }

  /* macOS: keep room for nothing special, buttons stay on the right for consistency */
</style>
</head>
<body>
  <div class="bar" id="bar">
    <div class="brand"><img src="../assets/icon.png" alt=""><span>Proton Mail</span></div>
    <div class="controls">
      <button id="min" title="Minimize" aria-label="Minimize">
        <svg viewBox="0 0 14 14"><path d="M2.5 7h9"/></svg>
      </button>
      <button id="fs" title="Toggle fullscreen (F11)" aria-label="Toggle fullscreen">
        <svg class="enter" viewBox="0 0 14 14"><path d="M2.5 5V2.5H5M9 2.5h2.5V5M11.5 9v2.5H9M5 11.5H2.5V9"/></svg>
        <svg class="exit" viewBox="0 0 14 14"><path d="M5 2.5V5H2.5M11.5 5H9V2.5M9 11.5V9h2.5M2.5 9H5v2.5"/></svg>
      </button>
      <button id="close" class="close" title="Exit" aria-label="Exit">
        <svg viewBox="0 0 14 14"><path d="M3 3l8 8M11 3l-8 8"/></svg>
      </button>
    </div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  $('min').addEventListener('click', () => window.bar.minimize());
  $('fs').addEventListener('click', () => window.bar.fullscreen());
  $('close').addEventListener('click', () => window.bar.close());
  $('bar').addEventListener('dblclick', (e) => {
    if (!e.target.closest('.controls')) window.bar.toggleMaximize();
  });
  window.bar.onState((s) => document.body.classList.toggle('is-fs', !!s.fullscreen));
</script>
</body>
</html>
